appId: com.traderrewind.app
productName: TraderRewind
directories:
  output: release
  buildResources: build
# better-sqlite3 是原生模块，package.json 的 postinstall 已经跑过
# electron-rebuild 把它编成 Electron 的 ABI 了。这里再让 electron-builder
# 重编一遍纯属重复劳动，而且在 Windows 上它清理旧 .node 时会走 trash 操作，
# 某些环境（受限的删除权限）会直接失败。所以交给 postinstall 独家负责。
npmRebuild: false
files:
  - out/**/*
  - package.json
win:
  # 平台级默认文件名，zip（免安装包）就用这个；
  # nsis 有自己的 artifactName 覆盖，两个文件不会重名。
  # 文件名里不带空格，省得下载链接被转义成 %20 看起来像乱码
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    # 安装程序：有开始菜单项、可卸载、能自选安装目录
    - target: nsis
      arch: [x64]
    # 免安装包：把 win-unpacked 打成 zip，解压即可运行，适合拷到别的机器/U 盘
    - target: zip
      arch: [x64]
  icon: build/icon.ico
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-setup.${ext}
